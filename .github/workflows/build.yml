#
# Build a UN1CA ROM for one device, entirely on GitHub-hosted runners.
# No private server is used anywhere in this workflow.
#
# Source of truth for every step below is upstream CI:
#   - Arnav3078/UN1CA-SM7150, .github/workflows/ci.yml (branch seventeen)
#     — the default source for m51; adds a device input, a
#     decrypted/encrypted build_type matrix, tool + firmware caching,
#     and nick-fields/retry around download_fw.sh.
#   - salvogiangri/UN1CA, .github/workflows/ci.yml (branch sixteen)
#     — the base; same runner, apt list (plus linux-modules-extra),
#     JDK 17 Temurin, and the same build order.
#
# --- The universal porter (user choice 2026-11-23) ---
# This workflow does NOT hard-code which upstream fork/branch to build
# a device from. The centre of the setup is the porter:
#   devices/*.json            — one manifest per device (m51 first)
#   devices/soc-families.json — SoC family -> primary upstream fork/branch
#   scripts/resolve-device.py — resolves device -> (soc_family, repo, branch)
# The `resolve` job below runs the resolver and the `build` job checks
# out exactly that repo@branch. Inputs source_repo/source_branch default
# to "auto" (use the manifest); set them to override for one run only.
# Adding a new device = copy devices/_template.json, fill it from the
# real upstream target/<codename>/ files, add its family to
# soc-families.json if it is new, and the workflow picks it up.
# Families today (research/02-targets-sm7150.md): sm7150 (mapped —
# a71, m51), sm7125, sm7325, sm8450, exynos2100, s5e8825, sm8250
# (listed — codename mapping verified, family defaults not yet built).
# One universal zip is NOT the goal: per-device kernel/vendor blobs,
# SoC and bootloader differ, so the porter produces per-SoC-family
# builds from one shared pipeline.
#
# --- Runner limits, honestly (GitHub-hosted ubuntu-24.04) ---
# - Job timeout: GitHub caps a job at 6 hours. This workflow sets
#   timeout-minutes: 360 and will be killed at that point, mid-build,
#   if a full build runs longer. Upstream builds are multi-hour.
# - Runner: 4 vCPU, 16 GB RAM, ~14 GB of usable disk before cleanup.
#   The "Free disk space" steps below are copied from upstream CI and
#   are required — a stock firmware download is multi-GB, the extracted
#   firmware plus the built ROM is multi-GB again, and the final zip is
#   ~8 GB. Without the cleanup the runner runs out of disk.
# - Cache: each actions/cache entry is capped at 10 GB. Firmware and
#   tool caches are best-effort; a cache miss means a full re-download.
# - Artifacts: a built ROM zip is too large to rely on as the only
#   output — upload-artifact has a per-file size practical limit and a
#   90-day default retention. The workflow uploads it as an artifact
#   (retention 7 days, as in upstream build-gofile.yml) and, in full
#   mode, also runs upstream release_rom.sh when requested.
# - Secrets: a full build needs PLATFORM_KEY_PK8 and PLATFORM_KEY_PEM
#   repository secrets (base64), exactly as upstream CI decodes them
#   into security/unica_platform.pk8 and security/unica_platform.x509.pem.
#   They are NOT needed for dry-run. Never commit them.
# - Dry-run (the default) downloads NO firmware and builds NO ROM.
#   It checks out the upstream tree, sets up tools, generates the
#   build config with buildenv.sh, and lists the scripts that a full
#   build would run. Use it to test this workflow safely.
# - Modify-and-fix loop (standing user rule): if a run fails, do NOT
#   stop at the first failure. Read the build-logs artifact (uploaded
#   by the last step, even on failure), fix the cause, commit, and
#   re-run via workflow_dispatch. Repeat until the ROM builds.
#   This workflow is re-runnable: workflow_dispatch on every run,
#   concurrency cancel-in-progress, and no step depends on a previous
#   run's state except the best-effort tool/firmware caches.
name: Build ROM

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device codename (devices/<codename>.json must exist)"
        required: true
        default: "m51"
        type: string
      source_repo:
        description: "Upstream UN1CA fork to build from ('auto' = resolve from the device manifest and SoC family)"
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "Arnav3078/UN1CA-SM7150"
          - "mehedihjoy0/UN1CA-SM7150"
          - "salvogiangri/UN1CA"
      source_branch:
        description: "Branch of the upstream fork ('auto' = resolve from the device manifest; seventeen for Arnav, sixteen for Mehedi/base)"
        required: true
        default: "auto"
        type: string
      build_type:
        description: "ROM variant (upstream BUILD_TYPE)"
        required: true
        default: "decrypted"
        type: choice
        options:
          - "decrypted"
          - "encrypted"
      mode:
        description: "dry-run validates only; full downloads firmware and builds the ROM"
        required: true
        default: "dry-run"
        type: choice
        options:
          - "dry-run"
          - "full"
      release_rom:
        description: "Run upstream release_rom.sh after a full build"
        required: false
        default: false
        type: boolean
      changelog:
        description: "Changelog text for release_rom.sh (only used with release_rom)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.device }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate device
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout un1ca-universal
        uses: actions/checkout@v7

      - name: Validate device JSON
        # GH_TOKEN authenticates the upstream API check in the script:
        # unauthenticated calls share the 60/hr per-IP limit and got
        # HTTP 403 on the runner, failing Build ROM #1 (2026-11-24).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/validate-device.sh "devices/${{ inputs.device }}.json" --check-upstream

  # The porter matrix: one job resolves the device to its upstream
  # fork/branch from the device manifest + SoC-family manifest, and
  # every later job uses these outputs instead of the raw inputs.
  # A wrong or missing family fails here, fast, before any download.
  resolve:
    name: Resolve upstream (${{ inputs.device }})
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      source_repo: ${{ steps.resolve.outputs.source_repo }}
      source_branch: ${{ steps.resolve.outputs.source_branch }}
      soc_family: ${{ steps.resolve.outputs.soc_family }}
      unica_version: ${{ steps.resolve.outputs.unica_version }}
      model: ${{ steps.resolve.outputs.model }}
    steps:
      - name: Checkout un1ca-universal
        uses: actions/checkout@v7

      - name: Resolve device to upstream fork/branch
        id: resolve
        run: |
          python3 scripts/resolve-device.py \
            "devices/${{ inputs.device }}.json" \
            --repo "${{ inputs.source_repo }}" \
            --branch "${{ inputs.source_branch }}"

  build:
    name: Build (${{ inputs.device }} / ${{ needs.resolve.outputs.soc_family }} / ${{ inputs.build_type }} / ${{ inputs.mode }})
    needs: [validate, resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 360  # GitHub job cap is 6 hours; see header notes.
    env:
      DEVICE: ${{ inputs.device }}
      BUILD_TYPE: ${{ inputs.build_type }}
      BUILD_MODE: ${{ inputs.mode }}
      # Build ROM #4 (2026-11-24) died in the upstream ParadigmKernel
      # patch: target/m51/patches/kernel/customize.sh resolves the
      # LostPrime kernel zip through the GitHub API and reads
      # $GITHUB_TOKEN only — it never sees GH_TOKEN. The "Build ROM"
      # step exported GH_TOKEN, so the call went unauthenticated, hit
      # the 60/hr shared-runner-IP limit (the same 403 that killed
      # Build ROM #1 in Validate), and KERNEL_URL came back empty:
      # `DOWNLOAD_FILE: URL is not set!` 1h25m into the build.
      # The runner does not export GITHUB_TOKEN by itself, so export
      # the token under the exact name the upstream script reads, at
      # job level so every upstream step that calls the API gets it.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # --- Free disk space, copied from upstream CI (3 steps) ---
      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Checkout un1ca-universal
        uses: actions/checkout@v7

      # Files uploaded through the GitHub web UI have mode 100644 (no
      # +x). Our scripts are always invoked via bash, but make them
      # executable anyway so no step can trip over the missing bit
      # (Build ROM #2 died on exactly that in setup-tools.sh).
      - name: Make porter scripts executable
        run: chmod +x "$GITHUB_WORKSPACE"/scripts/*.sh

      - name: Show resolved porter matrix
        run: |
          echo "Device:      $DEVICE"
          echo "Model:       ${{ needs.resolve.outputs.model }}"
          echo "SoC family:  ${{ needs.resolve.outputs.soc_family }}"
          echo "UN1CA:       ${{ needs.resolve.outputs.unica_version }}"
          echo "Upstream:    ${{ needs.resolve.outputs.source_repo }}@${{ needs.resolve.outputs.source_branch }}"

      # The upstream tree is checked out into ./upstream so that
      # buildenv.sh, scripts/ and target/ keep their upstream layout.
      - name: Checkout upstream UN1CA fork
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.source_branch }}
          submodules: 'recursive'
          fetch-depth: 1
          path: upstream

      # Porter performance pack (research/06-performance-lag-m51.md and
      # research/06c-frame-rate-60.md; user scope 2026-11-24: keep all
      # UN1CA flagship features, remove blur effects only). Copies the
      # overrides in patches/m51-performance/ over the upstream checkout
      # (relaxed thermal caps, live blur off, stock zram, stock perf
      # configs, explicit 60 Hz SurfaceFlinger props) before make_rom.sh
      # runs. m51-only: the script skips any other device with a clear
      # message, and fails loudly if upstream moved an overridden file.
      - name: Apply porter performance patches
        run: |
          bash "$GITHUB_WORKSPACE/patches/m51-performance/apply-performance-patches.sh" \
            "$GITHUB_WORKSPACE/upstream" "${{ inputs.device }}"

      - name: Set up build environment
        working-directory: upstream
        env:
          PLATFORM_KEY_PK8: ${{ secrets.PLATFORM_KEY_PK8 }}
          PLATFORM_KEY_PEM: ${{ secrets.PLATFORM_KEY_PEM }}
        run: |
          # setup-tools.sh installs the upstream apt list and decodes the
          # platform signing secrets into security/unica_platform.pk8 /
          # .x509.pem when present; when absent it generates throwaway
          # test keys so the full build can sign (test builds only).
          bash "$GITHUB_WORKSPACE/scripts/setup-tools.sh"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Check Java 17
        run: java -version
        # setup-tools.sh deliberately does NOT check for java: JDK 17 is
        # installed by the step above, after setup-tools runs. If this
        # step fails, the fix is in the setup-java step, not in the script.

      - name: Generate build config
        working-directory: upstream
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          source ./buildenv.sh "$DEVICE"
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
            echo "BUILD_TYPE=$BUILD_TYPE"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "--- config.sh (generated) ---"
          sed "/Automatically/d" "$OUT_DIR/config.sh"

      - name: Dry-run report
        if: inputs.mode == 'dry-run'
        working-directory: upstream
        run: |
          echo "DRY-RUN: no firmware downloaded, no ROM built."
          echo "Device: $DEVICE"
          echo "SoC family: ${{ needs.resolve.outputs.soc_family }}"
          echo "UN1CA version: ${{ needs.resolve.outputs.unica_version }}"
          echo "Source: ${{ needs.resolve.outputs.source_repo }}@${{ needs.resolve.outputs.source_branch }}"
          echo "Build type: $BUILD_TYPE"
          echo "Source firmware: $SOURCE_FIRMWARE"
          echo "Target firmware: $TARGET_FIRMWARE"
          echo "Scripts a full build would run, in order:"
          echo "  ./scripts/build_dependencies.sh"
          echo "  ./scripts/download_fw.sh   (multi-GB, samloader, retry x3)"
          echo "  ./scripts/extract_fw.sh"
          echo "  ./scripts/make_rom.sh --build-rom-zip"
          ls -l scripts/build_dependencies.sh scripts/download_fw.sh \
            scripts/extract_fw.sh scripts/make_rom.sh
          ./scripts/print_modules_info.sh || true

      - name: Cache build tools
        if: inputs.mode == 'full'
        uses: actions/cache@v4
        with:
          path: |
            upstream/out/tools
          key: tools-${{ runner.os }}-${{ hashFiles('upstream/scripts/build_dependencies.sh') }}
          restore-keys: |
            tools-${{ runner.os }}-

      - name: Build dependencies
        if: inputs.mode == 'full'
        working-directory: upstream
        run: ./scripts/build_dependencies.sh

      # Build ROM #3 (2026-11-24) died in upstream's camera patch:
      # target/m51/patches/tweaks/patch_camera.py calls bare `baksmali`
      # (disassemble), `smali` (reassemble) and `apksigner` (re-sign),
      # and none of them is installed by upstream CI or setup-tools.sh
      # — Arnav's own CI has failed on every run since the patch landed
      # (2026-11-12). The script runs the smali classes out of the
      # apktool jar build_dependencies.sh just built (with a Maven
      # Central fallback) and apksigner from Android build-tools r34,
      # all into $TOOLS_DIR/bin, which is already on PATH for Build ROM.
      - name: Install smali tools (baksmali/smali/apksigner)
        if: inputs.mode == 'full'
        run: bash "$GITHUB_WORKSPACE/scripts/install-smali-tools.sh"

      - name: Cache stock firmwares
        if: inputs.mode == 'full'
        uses: actions/cache@v4
        with:
          path: |
            upstream/out/odin
            upstream/out/cache
          key: fw-${{ inputs.device }}-${{ hashFiles('upstream/unica/configs/qssi.sh', 'upstream/target/${{ inputs.device }}/config.sh') }}
          restore-keys: |
            fw-${{ inputs.device }}-

      - name: Download stock firmwares
        if: inputs.mode == 'full'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: cd upstream && ./scripts/download_fw.sh

      - name: Extract stock firmwares
        if: inputs.mode == 'full'
        working-directory: upstream
        run: ./scripts/extract_fw.sh

      # Build ROM #4 (2026-11-24) died 1h25m in because the upstream
      # kernel patch could not resolve the LostPrime kernel URL (see
      # the job-level GITHUB_TOKEN note above). Run the same API
      # call + pattern up front so a repeat fails here in seconds
      # with a clear message instead of after the firmware download.
      - name: Pre-flight kernel release
        if: inputs.mode == 'full'
        run: |
          # Same call + pattern as the upstream kernel patch. The
          # Authorization header is added only when GITHUB_TOKEN is
          # set and non-empty (upstream's ${VAR:+...} form): sending
          # `Bearer ` with an empty token gets HTTP 401, while no
          # header at all is a plain unauthenticated call.
          KERNEL_URL=$(curl -fsSL ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} \
            "https://api.github.com/repos/kurtnettle/android_kernel_samsung_sm7150/releases/latest" \
            | grep -o 'https://[^"]*m51-ksu[^"]*\.zip' | head -n1)
          if [ -z "$KERNEL_URL" ]; then
            echo "::error::No m51-ksu kernel asset in the latest kurtnettle/android_kernel_samsung_sm7150 release (or the GitHub API call failed). The upstream kernel patch would abort with 'DOWNLOAD_FILE: URL is not set!'. Check the release assets / API rate limit and re-run."
            exit 1
          fi
          echo "Kernel URL: $KERNEL_URL"

      - name: Build ROM
        if: inputs.mode == 'full'
        working-directory: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/make_rom.sh --build-rom-zip

      # P0 (research/06c-frame-rate-60.md section 6): fail the build if
      # any 120 Hz leak survives into the built ROM. Greps the assembled
      # work dir - the patched files exactly as they are packed into the
      # partition images - for the HFR values in floating_feature.xml and
      # the frame-rate-override prop in vendor/build.prop. Full mode only:
      # dry-run builds no ROM. Runs before any release so a leaking ROM
      # is never published (the artifact upload below still runs on
      # failure, for inspection - the job itself is marked failed).
      - name: Assert 60 Hz pin (no 120 leaks)
        if: inputs.mode == 'full'
        run: |
          bash "$GITHUB_WORKSPACE/scripts/assert-60hz.sh" "$WORK_DIR"

      - name: Release this ROM
        if: inputs.mode == 'full' && inputs.release_rom
        working-directory: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_TEXT: ${{ inputs.changelog }}
        run: ./scripts/release_rom.sh

      - name: Upload ROM artifact
        if: inputs.mode == 'full' && always()
        uses: actions/upload-artifact@v4
        with:
          name: UN1CA-${{ inputs.device }}-${{ inputs.build_type }}
          path: upstream/out/*.zip
          retention-days: 7
          if-no-files-found: warn

      # Modify-and-fix loop: logs are always uploaded, even on failure,
      # so the next fix can be made from evidence, not guesswork.
      - name: Collect build logs
        if: always()
        run: |
          mkdir -p logs
          cp upstream/out/config.sh logs/config.sh 2>/dev/null || true
          find upstream/out -name '*.log' -exec cp {} logs/ \; 2>/dev/null || true
          # Disk is failure point #1 for this build (see header notes),
          # so snapshot disk usage with the logs, not just the logs.
          df -h > logs/disk-usage.txt 2>/dev/null || true
          du -sh upstream/out/* 2>/dev/null >> logs/disk-usage.txt || true
          {
            echo "device=$DEVICE"
            echo "soc_family=${{ needs.resolve.outputs.soc_family }}"
            echo "unica_version=${{ needs.resolve.outputs.unica_version }}"
            echo "mode=$BUILD_MODE"
            echo "build_type=$BUILD_TYPE"
            echo "source=${{ needs.resolve.outputs.source_repo }}@${{ needs.resolve.outputs.source_branch }}"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
          } > logs/build-summary.txt
          ls -l logs/ || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.device }}-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: warn

      # Surface the outcome where the run is read first (the run page),
      # not only inside the logs artifact. ${{ job.status }} at this
      # last step is the job outcome so far (success / failure /
      # cancelled). A failed run's next step is always: open the
      # build-logs artifact, find the failing step's log, fix, re-run.
      - name: Build summary
        if: always()
        run: |
          {
            echo "## UN1CA build — ${{ inputs.device }} (${{ inputs.build_type }} / ${{ inputs.mode }})"
            echo ""
            echo "- Outcome: **${{ job.status }}**"
            echo "- SoC family: \`${{ needs.resolve.outputs.soc_family }}\` (UN1CA ${{ needs.resolve.outputs.unica_version }})"
            echo "- Source: \`${{ needs.resolve.outputs.source_repo }}@${{ needs.resolve.outputs.source_branch }}\`"
            echo "- Run: \`${{ github.run_id }}\`, commit \`${{ github.sha }}\`"
            echo "- ROM artifact: \`UN1CA-${{ inputs.device }}-${{ inputs.build_type }}\` (full mode, 7 days)"
            echo "- Logs artifact: \`build-logs-${{ inputs.device }}-${{ github.run_id }}\` (14 days)"
            echo ""
            if [ "${{ job.status }}" = "failure" ]; then
              echo "Failed. Open the build-logs artifact, find the step"
              echo "that failed, fix the cause, commit, re-run via"
              echo "workflow_dispatch. See research/01-build-system.md"
              echo "(\"Most likely failure points\") for the usual causes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
